[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "apim-assess"
version = "0.0.1"
description = "Read-only Azure API Management assessment CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11,<4",
  "azure-identity>=1.20,<2",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12",
  "types-defusedxml>=0.7",
]

[project.scripts]
apim-assess = "apim_assess.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apim_assess"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
