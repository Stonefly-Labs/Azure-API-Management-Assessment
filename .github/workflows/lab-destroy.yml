name: Lab Destroy
on:
  workflow_dispatch:
    inputs:
      purge_only:
        description: "Only purge soft-deleted APIM, Foundry, and Key Vault tombstones"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      purge_only:
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-validation-lab-westus3
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Validation Lab & Purge Tombstones (westus3)
    runs-on: ubuntu-latest
    environment: azure-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install apim-assess and lab dependencies
        run: python -m pip install -e ".[dev,lab]"
      - name: Azure Login (Deploy OIDC Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete Disposable Lab RG and Purge Soft-Delete Tombstones
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LAB_RESOURCE_GROUP: ${{ vars.AZURE_LAB_RESOURCE_GROUP || 'rg-apv-lab-wus3-001' }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus3' }}
        run: |
          PURGE_FLAG=""
          if [ "${{ inputs.purge_only }}" = "true" ]; then
            PURGE_FLAG="--purge-only"
          fi
          python -m scripts.lab.destroy $PURGE_FLAG
