name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python -m build
      - run: apim-assess --help
      - run: apim-assess mcp --help
      - name: Verify base-only wheel installation
        shell: bash
        run: |
          python -m venv base-install
          if [ -f base-install/bin/python ]; then PY=base-install/bin/python; else PY=base-install/Scripts/python.exe; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -c 'from apim_assess.cli import app; import importlib.util; assert importlib.util.find_spec("mcp") is None'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag apim-assess:ci .
      - run: docker run --rm --network none apim-assess:ci --help
      - run: test "$(docker run --rm --network none --entrypoint id apim-assess:ci -u)" = 10001
      - run: |
          mkdir -p container-output
          chmod 777 container-output
          docker run --rm --network none -v "$PWD/tests/fixtures:/input:ro" -v "$PWD/container-output:/output" apim-assess:ci analyze --snapshot /input/sample_multi_apim_snapshot.json --output /output/findings.json
          docker run --rm --network none -v "$PWD/tests/fixtures:/input:ro" -v "$PWD/container-output:/output" apim-assess:ci report --snapshot /input/sample_multi_apim_snapshot.json --findings /output/findings.json --output /output/report.html
          test -s container-output/report.html
          docker run --rm --network none -v "$PWD/container-output:/output:ro" --entrypoint python apim-assess:ci -c 'import json; d=json.load(open("/output/findings.json")); assert d["schema_version"] == "1.5"; assert len(d["findings"]) == 165; assert any(f["rule"]["id"] == "APIM-AIGW-006" for f in d["findings"])'
  mcp-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[mcp]"
      - run: docker build --file Dockerfile.mcp --tag apim-assess:mcp-ci .
      - run: test "$(docker run --rm --network none --entrypoint id apim-assess:mcp-ci -u)" = 10001
      - run: docker run --rm --network none --entrypoint az apim-assess:mcp-ci --version
      - name: Empty persistent cache permissions
        run: |
          docker volume create apim-assess-ci-cache
          docker run --rm --network none --mount type=volume,source=apim-assess-ci-cache,target=/home/assessor/.azure --entrypoint python apim-assess:mcp-ci -c 'import os; from pathlib import Path; p=Path(os.environ["AZURE_CONFIG_DIR"])/"permission-test"; p.write_text("synthetic"); p.unlink()'
          docker volume rm apim-assess-ci-cache
      - name: Real container stdio pipeline without network or credentials
        run: |
          mkdir -p mcp-output
          chmod 777 mcp-output
          python scripts/mcp_smoke.py --workspace mcp-output --image apim-assess:mcp-ci
