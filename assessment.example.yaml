# Only implemented options are accepted. Optional upstream/AI network access is off by default.
env: auto
targets:
  instances:
    - resource_id: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/example-rg/providers/Microsoft.ApiManagement/service/example-apim
      env: non-prod
  # ARM discovery is read-only and restricted to explicitly listed subscriptions.
  subscriptions: []
  resource_groups: []
modules:
  metrics: true
  networking: true
  defender_policy: true
  # Opt-in: read aggregate logs only from enabled GatewayLogs diagnostic workspaces.
  # Requires defender_policy=true for diagnostic linkage; never discovers arbitrary workspaces.
  log_analytics_kql: false
  afd:
    enabled: false
    auto_discover: true  # Resource Graph is limited to the assessment's subscriptions.
    resource_ids: []  # Explicit Microsoft.Cdn/profiles IDs; can include other subscriptions.
  appgw:
    enabled: false
    auto_discover: true
    resource_ids: []  # Explicit Microsoft.Network/applicationGateways IDs.
telemetry:
  lookback_days: 30
  kql_max_rows: 5  # Maximum rows in each API hotspot/latency result per workspace/table.
  kql_timeout_seconds: 30
rules:
  # Waivers retain original outcomes/evidence, but are excluded from scoring.
  # A resource_id is optional; a matching resource waiver overrides a global one.
  waivers: []
  # Example: [{rule_id: APIM-REL-006, justification: "Approved recovery design"}]
  severity_overrides: {}
  # Example: {APIM-REL-006: Low}; overrides take precedence over profile defaults.
  thresholds:
    capacity_low_pct: 25
    capacity_warning_pct: 70
    capacity_max_pct: 85
    cert_expiry_days: 30
    app_insights_max_sampling_pct: 50
    diagnostic_body_bytes: 1024
    payload_max_bytes: 102400
    backend_latency_ms: 2000
    gateway_error_pct: 1
    policy_max_age_days: 2
# Uncomment only for an explicitly requested --enrich-ai run. A compatible non-reasoning
# chat model must support JSON mode, temperature=0 and max_tokens.
# Only aggregate rule/result counts are sent; no resource identities, evidence or waivers.
# ai_enrichment:
#   provider: azure_openai  # Or openai_compatible, with a base endpoint ending in /v1.
#   endpoint: https://YOUR-RESOURCE.openai.azure.com
#   deployment: YOUR-CHAT-DEPLOYMENT
#   api_key_env: APIM_ASSESS_AI_KEY  # Optional for Azure: otherwise DefaultAzureCredential.
#   timeout_seconds: 30
