# Only implemented options are accepted; adjacent and upstream collectors remain deferred.
env: auto
targets:
  instances:
    - resource_id: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/example-rg/providers/Microsoft.ApiManagement/service/example-apim
      env: non-prod
  # ARM discovery is read-only and restricted to explicitly listed subscriptions.
  subscriptions: []
  resource_groups: []
modules:
  metrics: true
telemetry:
  lookback_days: 14
rules:
  # Waivers retain original outcomes/evidence, but are excluded from scoring.
  # A resource_id is optional; a matching resource waiver overrides a global one.
  waivers: []
  # Example: [{rule_id: APIM-REL-006, justification: "Approved recovery design"}]
  severity_overrides: {}
  # Example: {APIM-REL-006: Low}; overrides take precedence over profile defaults.
  thresholds:
    capacity_low_pct: 25
    capacity_warning_pct: 70
    capacity_max_pct: 85
    cert_expiry_days: 30
    app_insights_max_sampling_pct: 50
    diagnostic_body_bytes: 1024
    payload_max_bytes: 102400
